[project]
name = "eodh-workflow-starter"
# The workflow's version. It must match `s:softwareVersion` and the `dockerPull` tag in cwl/workflow.cwl.
# Change all three with `make bump VERSION=x.y.z`.
version = "0.1.0"
description = "Starter for EODH Workflow Runner workflows that write renderable STAC outputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "psutil>=5.9",
    "pystac[validation]>=1.14",
    "rasterio>=1.5",
    "rio-cogeo>=7.0.4",
]

[dependency-groups]
dev = [
    "cwltool>=3.3.20260925135507",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
