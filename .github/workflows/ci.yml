name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Checks 1-4 (lint, tests, end to end, CWL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make check

  check-docker:
    # Level 5. Optional on pull requests: delete this job if it is too slow for your workflow.
    name: Check 5 (image through cwltool)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --frozen
      - run: make check-docker
