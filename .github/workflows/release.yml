# Push a `vX.Y.Z` tag to release: check versions, run checks 1-5, then push the image to GHCR.
# After the first push, make the package public (see AGENTS.md, "Release"): ADES pulls without credentials.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --frozen

      - name: Versions match the tag
        run: uv run python scripts/versions.py check --tag "${GITHUB_REF_NAME}"

      - name: Image name matches this repository
        run: |
          image="$(uv run --quiet python scripts/versions.py image)"
          expected="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          if [ "$image" != "$expected" ]; then
            echo "dockerPull is $image but this repository publishes $expected. Fix dockerPull in cwl/." >&2
            exit 1
          fi

      - run: make check
      - run: make check-docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image checked above
        run: docker push "$(uv run --quiet python scripts/versions.py image)"
